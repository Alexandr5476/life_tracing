name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Build, test, and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: python3 -m unittest discover -s .github/scripts -p "test_*.py"
      - run: ./gradlew ktlintCheck detekt lintDebug :domain:test :data:testDebugUnitTest :app:testDebugUnitTest coverageReport coverageVerify :app:assembleDebug --stacktrace
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kover-coverage-reports
          path: |
            domain/build/reports/kover/html/**
            domain/build/reports/kover/report.xml
            data/build/reports/kover/html/**
            data/build/reports/kover/report.xml
            app/build/reports/kover/html/**
            app/build/reports/kover/report.xml
          if-no-files-found: ignore
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifetracing-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  instrumented-tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            name: Managed-device instrumentation tests
          - api: 26
            name: Managed-device instrumentation tests (API 26)
          - api: 31
            name: Managed-device instrumentation tests (API 31)
          - api: 33
            name: Managed-device instrumentation tests (API 33)
          - api: 36
            name: Managed-device instrumentation tests (API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run complete data and app suites
        env:
          EXPECTED_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/run-instrumentation.py --api ${{ matrix.api }}
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumentation-reports-api${{ matrix.api }}-attempt${{ github.run_attempt }}
          retention-days: 30
          path: |
            data/build/reports/**
            app/build/reports/**
            data/build/outputs/androidTest-results/**
            app/build/outputs/androidTest-results/**
            data/build/outputs/managed_device_android_test_additional_output/**
            app/build/outputs/managed_device_android_test_additional_output/**
            ci-evidence/api${{ matrix.api }}/**
          if-no-files-found: error
      - name: Upload independently verifiable JUnit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumentation-evidence-api${{ matrix.api }}-attempt${{ github.run_attempt }}
          retention-days: 30
          path: ci-evidence/api${{ matrix.api }}/
          if-no-files-found: error
